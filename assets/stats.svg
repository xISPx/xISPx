<svg width="420" height="192" viewBox="0 0 420 192" xmlns="http://www.w3.org/2000/svg" role="img">
<style>
    .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .title { fill: #1f2328; font: 600 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Noto Sans,Helvetica,Arial,sans-serif; }
    .accent { fill: #8b5cf6; }
    .val { fill: #6d28d9; font: 700 26px -apple-system,BlinkMacSystemFont,'Segoe UI',Noto Sans,Helvetica,Arial,sans-serif; }
    .val-sm { fill: #6d28d9; font: 700 20px -apple-system,BlinkMacSystemFont,'Segoe UI',Noto Sans,Helvetica,Arial,sans-serif; }
    .lbl { fill: #59636e; font: 400 12px -apple-system,BlinkMacSystemFont,'Segoe UI',Noto Sans,Helvetica,Arial,sans-serif; }
    .name { fill: #1f2328; font: 500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Noto Sans,Helvetica,Arial,sans-serif; }
    .pct { fill: #59636e; font: 400 12px -apple-system,BlinkMacSystemFont,'Segoe UI',Noto Sans,Helvetica,Arial,sans-serif; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #0d1117; stroke: #30363d; }
      .title, .name { fill: #e6edf3; }
      .val, .val-sm { fill: #a78bfa; }
      .lbl, .pct { fill: #9198a1; }
    }
</style>
<rect class="card" x="1" y="1" width="418" height="190" rx="14"/>
<text class="title" x="28" y="40">GitHub Stats</text>
<rect class="accent" x="28" y="49" width="42" height="3" rx="1.5"/>
<text class="lbl" x="36" y="92">Public repos</text>
<text class="val" x="36" y="122">8</text>
<text class="lbl" x="236" y="92">Stars earned</text>
<text class="val" x="236" y="122">2</text>
<text class="lbl" x="36" y="150">Followers</text>
<text class="val" x="36" y="180">15</text>
<text class="lbl" x="236" y="150">Joined GitHub</text>
<text class="val-sm" x="236" y="180">Mar 2025</text>
</svg>
