<svg width="420" height="254" viewBox="0 0 420 254" xmlns="http://www.w3.org/2000/svg" role="img">
<style>
    .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .title { fill: #1f2328; font: 600 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Noto Sans,Helvetica,Arial,sans-serif; }
    .accent { fill: #8b5cf6; }
    .val { fill: #6d28d9; font: 700 26px -apple-system,BlinkMacSystemFont,'Segoe UI',Noto Sans,Helvetica,Arial,sans-serif; }
    .val-sm { fill: #6d28d9; font: 700 20px -apple-system,BlinkMacSystemFont,'Segoe UI',Noto Sans,Helvetica,Arial,sans-serif; }
    .lbl { fill: #59636e; font: 400 12px -apple-system,BlinkMacSystemFont,'Segoe UI',Noto Sans,Helvetica,Arial,sans-serif; }
    .name { fill: #1f2328; font: 500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Noto Sans,Helvetica,Arial,sans-serif; }
    .pct { fill: #59636e; font: 400 12px -apple-system,BlinkMacSystemFont,'Segoe UI',Noto Sans,Helvetica,Arial,sans-serif; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #0d1117; stroke: #30363d; }
      .title, .name { fill: #e6edf3; }
      .val, .val-sm { fill: #a78bfa; }
      .lbl, .pct { fill: #9198a1; }
    }
</style>
<rect class="card" x="1" y="1" width="418" height="252" rx="14"/>
<text class="title" x="28" y="40">Most Used Languages</text>
<rect class="accent" x="28" y="49" width="42" height="3" rx="1.5"/>
<clipPath id="round"><rect x="28" y="58" width="364" height="14" rx="7"/></clipPath>
<g clip-path="url(#round)">
<rect x="28.0" y="58" width="292.4" height="14" fill="#555555"/>
<rect x="320.4" y="58" width="35.9" height="14" fill="#f34b7d"/>
<rect x="356.3" y="58" width="25.2" height="14" fill="#f1e05a"/>
<rect x="381.5" y="58" width="6.1" height="14" fill="#e34c26"/>
<rect x="387.6" y="58" width="2.4" height="14" fill="#563d7c"/>
<rect x="390.0" y="58" width="1.2" height="14" fill="#3572a5"/>
<rect x="391.2" y="58" width="0.5" height="14" fill="#89e051"/>
<rect x="391.7" y="58" width="0.2" height="14" fill="#c2b280"/>
<rect x="391.8" y="58" width="0.2" height="14" fill="#8b949e"/>
</g>
<circle cx="40" cy="100" r="5" fill="#555555"/>
<text class="name" x="52" y="104">C</text>
<text class="pct" x="206" y="104" text-anchor="end">80.3%</text>
<circle cx="230" cy="100" r="5" fill="#f34b7d"/>
<text class="name" x="242" y="104">C++</text>
<text class="pct" x="396" y="104" text-anchor="end">9.9%</text>
<circle cx="40" cy="140" r="5" fill="#f1e05a"/>
<text class="name" x="52" y="144">JavaScript</text>
<text class="pct" x="206" y="144" text-anchor="end">6.9%</text>
<circle cx="230" cy="140" r="5" fill="#e34c26"/>
<text class="name" x="242" y="144">HTML</text>
<text class="pct" x="396" y="144" text-anchor="end">1.7%</text>
<circle cx="40" cy="180" r="5" fill="#563d7c"/>
<text class="name" x="52" y="184">CSS</text>
<text class="pct" x="206" y="184" text-anchor="end">0.6%</text>
<circle cx="230" cy="180" r="5" fill="#3572a5"/>
<text class="name" x="242" y="184">Python</text>
<text class="pct" x="396" y="184" text-anchor="end">0.3%</text>
<circle cx="40" cy="220" r="5" fill="#89e051"/>
<text class="name" x="52" y="224">Shell</text>
<text class="pct" x="206" y="224" text-anchor="end">0.1%</text>
</svg>
